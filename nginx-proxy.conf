server {
    listen 80;
    server_name mehdicherki.fr www.mehdicherki.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://mehdicherki.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mehdicherki.fr;

    ssl_certificate /etc/letsencrypt/live/mehdicherki.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mehdicherki.fr/privkey.pem;

    return 301 https://mehdicherki.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name mehdicherki.fr;

    ssl_certificate /etc/letsencrypt/live/mehdicherki.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mehdicherki.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}