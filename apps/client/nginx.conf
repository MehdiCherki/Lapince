# Pages HTML jamais gardées par le navigateur (ni cache, ni copie « précédent/suivant ») :
# après une déconnexion, « Précédent » ne doit pas réafficher un écran privé.
# Les images et les assets (fichiers versionnés) restent en cache : valeur vide = en-tête non envoyé.
map $sent_http_content_type $page_cache_control {
    ~*text/html  "no-store";
    default      "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des textes (HTML, JS, CSS, JSON de l'API, SVG) : environ 4 fois moins d'octets transférés.
    # Les images WebP sont déjà compressées : les recompresser coûterait du calcul pour rien.
    # Pas de risque BREACH : aucune réponse ne contient de secret à côté d'une donnée envoyée par le visiteur
    # (les jetons de session voyagent dans les cookies, en en-têtes, que gzip ne touche pas).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $page_cache_control always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data: https://api.dicebear.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none';" always;
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3007/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
