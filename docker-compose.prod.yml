services:

  # --- Base de données PostgreSQL ---
  db:
    image: postgres:17
    restart: unless-stopped  # Redémarre automatiquement sauf si arrêt manuel
    environment:
      POSTGRES_USER: ${POSTGRES_USER}         # Nom d'utilisateur (depuis .env)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Mot de passe (depuis .env)
      POSTGRES_DB: ${POSTGRES_DB}             # Nom de la base de données
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persiste les données entre les redémarrages
    healthcheck:
      # Vérifie que Postgres est prêt à accepter des connexions avant de démarrer les autres services
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s     # Vérifie toutes les 10 secondes
      timeout: 5s       # Échoue si la réponse prend plus de 5s
      retries: 5        # 5 tentatives avant de considérer le service comme "unhealthy"
      start_period: 20s # Laisse 20s au démarrage avant de commencer les vérifications

  # --- Redis (compteurs du limiteur de tentatives de l'API) ---
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
    volumes:
      - ./redis/start.sh:/redis/start.sh:ro  # ACL, sans persistance, mémoire bornée
    command: ["sh", "/redis/start.sh"]
    networks:
      - redis   # Réseau interne : joignable par l'API seulement, aucun port publié
    healthcheck:
      # PONG seulement avec le bon mot de passe ; REDISCLI_AUTH : le mot de passe n'apparaît pas dans la commande
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user lapince_app ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- API Node.js (backend) ---
  api:
    build:
      context: ./apps/api
      dockerfile: api.Dockerfile  # Dockerfile de prod : compile en JS puis lance node dist/
    restart: unless-stopped  # Redémarre après un crash ou un redémarrage du serveur
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}   # URL de connexion à Postgres
      PORT: ${API_PORT}               # Port interne sur lequel l'API écoute
      JWT_SECRET: ${JWT_SECRET}       # Clé secrète pour signer les tokens JWT
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS} # Liste des origines autorisées pour les requêtes CORS (séparées par des virgules)
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://redis:6379   # Service redis ci-dessus (hôte et port, sans identifiants)
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
    networks:
      - default
      - redis
    depends_on:
      db:
        condition: service_healthy  # Démarre l'API seulement quand Postgres est prêt
      redis:
        condition: service_healthy  # ... et Redis

  # --- Client React/Vite (frontend) ---
  client:
    build:
      context: ./apps/client
      dockerfile: client.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - api

  # --- Nginx (reverse proxy + HTTPS, certificats Let's Encrypt fournis par certbot) ---
  nginx-proxy:
    image: nginx:alpine
    restart: unless-stopped
    # Nginx ne relit pas tout seul un certificat renouvelé par certbot : rechargement toutes les 6 h.
    # exec : nginx remplace le shell (PID 1) et reçoit directement le signal d'arrêt de Docker.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - client

  # --- Certbot (renouvellement des certificats, mode webroot, essai toutes les 12 h) ---
  certbot:
    image: certbot/certbot
    restart: unless-stopped  # Sans ça, plus aucun renouvellement après un redémarrage du serveur
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_webroot:

networks:
  redis:
    internal: true  # Sans accès à Internet ; seuls redis et api y sont branchés
