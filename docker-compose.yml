services:

  # --- Base de données PostgreSQL ---
  db:
    image: postgres:18
    restart: unless-stopped  # Redémarre automatiquement sauf si arrêt manuel
    environment:
      POSTGRES_USER: ${POSTGRES_USER}         # Nom d'utilisateur (depuis .env)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Mot de passe (depuis .env)
      POSTGRES_DB: ${POSTGRES_DB}             # Nom de la base de données
      # Mots de passe des rôles lapince_owner et lapince_app, lus par db/roles.sql (\getenv)
      LAPINCE_OWNER_PASSWORD: ${LAPINCE_OWNER_PASSWORD:-}
      LAPINCE_APP_PASSWORD: ${LAPINCE_APP_PASSWORD:-}
    ports:
      - "${POSTGRES_LOCAL_PORT}:5432"  # Expose Postgres sur le port local défini dans .env
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persiste les données entre les redémarrages
      # Volume neuf : l'image crée les rôles (exécuté une seule fois, à l'initialisation).
      # Volume existant : même script, lancé à la main (docs/base-de-donnees.md, « Comptes et droits »)
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      # Vérifie que Postgres est prêt à accepter des connexions avant de démarrer les autres services
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s     # Vérifie toutes les 10 secondes
      timeout: 5s       # Échoue si la réponse prend plus de 5s
      retries: 5        # 5 tentatives avant de considérer le service comme "unhealthy"
      start_period: 20s # Laisse 20s au démarrage avant de commencer les vérifications

  # --- Redis (compteurs du limiteur de tentatives de l'API) ---
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
    volumes:
      - ./redis/start.sh:/redis/start.sh:ro  # ACL, sans persistance, mémoire bornée
    command: ["sh", "/redis/start.sh"]
    networks:
      - redis   # Réseau interne : joignable par l'API seulement, aucun port publié
    healthcheck:
      # PONG seulement avec le bon mot de passe ; REDISCLI_AUTH : le mot de passe n'apparaît pas dans la commande
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user lapince_app ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- API Node.js (backend) ---
  api:
    build:
      context: ./apps/api
      dockerfile: api.dev.Dockerfile  # Dockerfile de dev : lance tsx --watch (hot reload)
    environment:
      NODE_ENV: ${NODE_ENV}           # production | development
      # Comptes PostgreSQL séparés : l'API avec lapince_app (données seulement),
      # migrations et seed avec lapince_owner (propriétaire du schéma)
      DATABASE_URL: ${DATABASE_URL}   # rôle lapince_app
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL manquante dans .env}  # rôle lapince_owner
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL:-}  # base shadow de prisma migrate dev (lapince_shadow)
      DATABASE_URL_TEST: ${DATABASE_URL_TEST}  # Base des tests d'intégration (lapince_test), rôle lapince_app
      MIGRATION_DATABASE_URL_TEST: ${MIGRATION_DATABASE_URL_TEST}  # même base, rôle lapince_owner (npm run test:db:setup)
      PORT: ${API_PORT}               # Port interne sur lequel l'API écoute
      JWT_SECRET: ${JWT_SECRET}       # Clé secrète pour signer les tokens JWT
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS} # Liste des origines autorisées pour les requêtes CORS (séparées par des virgules)
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://redis:6379   # Service redis ci-dessus (hôte et port, sans identifiants)
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
    ports:
      - "${API_LOCAL_PORT}:${API_PORT}"  # Mappe le port local vers le port interne de l'API
    networks:
      - default
      - redis
    depends_on:
      db:
        condition: service_healthy  # Démarre l'API seulement quand Postgres est prêt
      redis:
        condition: service_healthy  # ... et Redis
    develop:
      watch:
        # Synchronise les fichiers source dans le conteneur sans rebuild (tsx --watch détecte le changement)
        - action: sync
          path: ./apps/api/src
          target: /app/src
        - action: sync
          path: ./apps/api/tests
          target: /app/tests
        # Reconstruit l'image si les dépendances, le schéma Prisma ou la config TypeScript changent
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/api/prisma.config.ts
        - action: rebuild
          path: ./apps/api/prisma/schema.prisma
        - action: rebuild
          path: ./apps/api/tsconfig.json
        - action: rebuild
          path: ./apps/api/tsconfig.build.json
        - action: rebuild
          path: ./apps/api/vitest.config.ts

  # --- Client React/Vite (frontend) ---
  client:
    build:
      context: ./apps/client
      dockerfile: client.dev.Dockerfile  # Dockerfile de dev : lance vite --host (hot reload)
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL} # URL de base pour les requêtes API (ex: http://localhost:5173/api, Vite proxy gère le reste)
    ports:
      - "${CLIENT_LOCAL_PORT}:5173"  # Port 5173 = serveur de dev Vite (pas nginx)
    depends_on:
      - api  # Attend que l'API soit démarrée
    develop:
      watch:
        # Synchronise les fichiers source dans le conteneur sans rebuild (Vite HMR détecte le changement)
        - action: sync
          path: ./apps/client/src
          target: /app/src
        # Reconstruit l'image si les dépendances changent
        - action: rebuild
          path: ./apps/client/package.json

  # --- Prisma Studio (interface visuelle de la base de données) ---
  studio:
    build:
      context: ./apps/api
      dockerfile: api.dev.Dockerfile  # Même image que l'API : node_modules, OpenSSL et client Prisma déjà dedans
    environment:
      # Studio lit l'adresse de prisma.config.ts (MIGRATION_DATABASE_URL) : on lui donne celle de
      # l'API, rôle lapince_app, qui lit et modifie les données mais aucune table
      MIGRATION_DATABASE_URL: ${DATABASE_URL}
    ports:
      - "5555:5555"  # Interface Prisma Studio accessible sur http://localhost:5555
    command: npx prisma studio --port 5555 --browser none  # Remplace le CMD de l'image (migrations + seed + serveur)
    tty: true
    depends_on:
      db:
        condition: service_healthy  # Attend que Postgres soit prêt avant de se connecter
    develop:
      watch:
        # Le schéma est copié dans l'image : on la reconstruit s'il change
        - action: rebuild
          path: ./apps/api/prisma/schema.prisma

# --- Volumes nommés ---
volumes:
  postgres_data:  # Volume persistant pour les données PostgreSQL (survit aux docker compose down)

# --- Réseaux ---
networks:
  redis:
    internal: true  # Sans accès à Internet ; seuls redis et api y sont branchés
